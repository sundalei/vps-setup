---
# Packages, modules, SELinux and firewall. No vhost here -- see vhosts.yml.

- name: Install Apache
  ansible.builtin.package:
    name: "{{ apache_packages }}"
    state: present

# Debian ships proxy/rewrite/ssl disabled. Skipped on RHEL, where the list is empty.
# Loading a module needs a full restart; a reload will not pick it up.
- name: Enable required Apache modules (Debian)
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ apache_modules }}"
  notify: Restart apache

# Allow Apache to reverse-proxy traffic to Kibana (:5601); without this,
# SELinux on RHEL blocks outbound connections and causes 503 errors.
- name: Allow httpd outbound connections (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['selinux'].status | default('disabled') == 'enabled'

- name: Open http/https (firewalld)
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: [http, https]
  when: ansible_facts['os_family'] == 'RedHat'

- name: Open http/https (ufw)
  community.general.ufw:
    rule: allow
    name: "Apache Full"
  when: ansible_facts['os_family'] == 'Debian'

# On RHEL-family distros, Certbot is not in base repositories and must come from EPEL.
- name: Install EPEL (RedHat)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install certbot
  ansible.builtin.package:
    name: "{{ apache_certbot_packages }}"
    state: present

# Shared by every vhost. Certbot writes the challenge token here and Apache
# serves it over plain :80; nothing else is ever served from this tree.
- name: Create the ACME webroot
  ansible.builtin.file:
    path: "{{ apache_acme_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The certbot package usually creates this, but not on every distro/version.
- name: Ensure the renewal hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    owner: root
    group: root
    state: directory
    mode: "0755"

# Certbot's own systemd timer handlers renewal, but it has no idea Apache is
# holding the old certificate open. This hook fires only on successful renewal.
- name: Install the renewal reload hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/10-reload-apache.sh
    content: |
      #!/bin/sh
      # Ansible managed. Runs after certbot renewals any certificate on this host.
      systemctl reload {{ apache_service }}
    owner: root
    group: root
    mode: "0755"
