---
- name: Refuse to run without an SSH key
  ansible.builtin.assert:
    that:
      - admin_ssh_public_key is defined
      - admin_ssh_public_key | length > 0
    fail_msg: "admin_ssh_public_key must be set in vault before bootstrapping."
    quiet: true

- name: Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

# zsh has to exist before the account points at it: sshd runs every command
# through the login shell, Ansible's included.
- name: "Install zsh and git"
  ansible.builtin.package:
    name: [zsh, git]
    state: present

- name: Set admin group per OS family
  ansible.builtin.set_fact:
    bootstrap_admin_group: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"

- name: Ensure the admin group exists
  ansible.builtin.group:
    name: "{{ bootstrap_admin_group }}"
    state: present

- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: ["{{ bootstrap_admin_group }}"]
    append: true
    shell: /usr/bin/zsh
    create_home: true
    state: present
    password: "{{ admin_password }}"

- name: Deploy admin user SSH public key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_key }}"
    manage_dir: true
    exclusive: true

- name: Grant passwordless sudo via a validated drop-in
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Install oh-my-zsh for the admin user
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "~{{ admin_user }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  become: true
  become_user: "{{ admin_user }}"

- name: Give the admin user the oh-my-zsh .zshrc
  ansible.builtin.copy:
    src: "~{{ admin_user }}/.oh-my-zsh/templates/zshrc.zsh-template"
    dest: "~{{ admin_user }}/.zshrc"
    remote_src: true
    force: false # only create the file if it doesn't exist yet
    mode: "0644"
  become: true
  become_user: "{{ admin_user }}"

# Add the user name and hostname to the zsh prompt.
- name: Show user and host name in the zsh prompt
  ansible.builtin.lineinfile:
    path: "~{{ admin_user }}/.zshrc"
    regexp: '^PROMPT="%n@'
    line: 'PROMPT="%n@%m $PROMPT"'
  become: true
  become_user: "{{ admin_user }}"
