---
# Everything, in dependency order. Individual projects can be run on their own:
#   ansible-playbook playbooks/elasticsearch.yml
# Each project playbook imports the pre steps it needs (bootstrap, base, network).
# Here they run once up front, and skip_prereqs stops each project from repeating them.
- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Baseline
  ansible.builtin.import_playbook: base.yml

- name: Network
  ansible.builtin.import_playbook: network.yml

- name: Elasticsearch stack
  ansible.builtin.import_playbook: elasticsearch.yml
  vars:
    skip_prereqs: true

- name: Java Dev environment
  ansible.builtin.import_playbook: java.yml
  vars:
    skip_prereqs: true

- name: MongoDB replica set
  ansible.builtin.import_playbook: mongodb.yml
  vars:
    skip_prereqs: true
