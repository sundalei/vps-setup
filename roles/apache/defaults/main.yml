---
# present -> install and configure;
# absent  -> stop and remove.
# Certificates under /etc/letsencrypt are never deleted:
# Let's Encrypt rate limits issuance, so throwing them away is expensive to undo.
apache_state: present

# Contact address Let's Encrypt uses for expiry warnings. No default on purpose:
# main.yml asserts it, so a missing value fails on task 1 rather than at issuance.
# apache_certbot_email: "you@example.com"

# Point at the staging CA while iterating. Staging certs are untrusted by browsers
# but are not rate limited, so a broken vhost costs nothing
apache_certbot_staging: false

# Webroot served on :80 for the ACME http-01 challenge. Shared by every vhost.
apache_acme_webroot: /var/www/letsencrypt

# Where certbot deposites fullchain.pem / privatekey.pem
apache_le_live_dir: /etc/letsencrypt/live

apache_hsts_max_age: 31536000

# Each site: name (file prefix), domain (ServerName + cert CN), backend
# (host:port the proxy forwards to), websockets (add the ws:// upgrade rule).
apache_sites: >-
  {{ [{'name': 'kibana',
       'domain': kibana_domain | default(''),
       'backend': "127.0.0.1:" ~ kibana_port,
       'websockets': true}]
     + ([{'name': 'es',
          'domain': es_domain | default(''),
          'backend': "127.0.0.1:" ~ es_http_port,
          'websockets': false}]
         if expose_elasticsearch | default (false) else []) }}
