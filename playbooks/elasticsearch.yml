---
# Elasticsearch needs three things first:
#   bootstrap.yml  -> creates the dalei user that we log in with
#   base.yml       -> base packages, the firewall and vm.max_map_count
#   network.yml    -> WireGuard, because nodes talk over the tunnel (transport 9300)
# With these imports, this playbook is safe to run on a fresh server.
# site.yml runs them once itself and sets skip_prereqs so they are not repeated.
- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml
  when: not (skip_prereqs | default(false) | bool)

- name: Baseline
  ansible.builtin.import_playbook: base.yml
  when: not (skip_prereqs | default(false) | bool)

- name: Network
  ansible.builtin.import_playbook: network.yml
  when: not (skip_prereqs | default(false) | bool)

# Elasticsearch Stack
# ------------------------------------------------------------------------------
# Divided into three distinct plays targeting separate inventory groups:
#   1. Elasticsearch Cluster (`es_cluster`) : Node setup, clustering, and security.
#   2. Kibana                (`kibana`)     : Analytics & visualization UI.
#   3. Web Proxy             (`web_proxy`)  : Reverse proxy & TLS termination.
#
# IMPORTANT: Play 1 must run against the ENTIRE `es_cluster` group together
# (avoid using `--limit` across cluster members) because:
#   - TLS Certificate Exchange : Transport certs are derived from `hostvars[ca_host]`.
#   - Peer Discovery           : `discovery.seed_hosts` is rendered from all group members.
#   - Cluster Health Gate      : Startup check validates that active node count
#                                matches the full size of `groups['es_cluster']`.
# ------------------------------------------------------------------------------
- name: Elasticsearch cluster
  hosts: es_cluster
  become: true
  roles:
    - role: elasticsearch
      tags: [elasticsearch, es, cluster]

- name: Kibana
  hosts: kibana
  become: true
  roles:
    - role: kibana
      tags: [kibana]

- name: Public reverse proxy and TLS
  hosts: web_proxy
  become: true
  roles:
    - role: apache
      tags: [apache, proxy]
