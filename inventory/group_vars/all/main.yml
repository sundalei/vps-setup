---
# --- Non-secret configuration (secrets live in vault.yml) ---
# Pin ALL cluster nodes to the exact same version
elastic_stack_version: "9.4.4"

cluster_name: "sundalei-es"

# Account used only by playbooks/bootstrap.yml, before admin_user exists
bootstrap_user: "root"

# Admin user created on every host
admin_user: "dalei"

# WireGuard private network
wg_subnet_cidr: "10.10.0.0/24"
wg_port: 51820
wg_interface: "wg0"

# Ports
es_http_port: 9200
es_transport_port: 9300
kibana_port: 5601

# JVM heap per node
es_heap: 1g

# Public hostname per Kibana node lives in host_vars/<host>.yml (kibana_domain)
expose_elasticsearch: true
apache_certbot_email: "sundalei1988@gmail.com"

# Where certs/keystores live
es_cert_dir: "/etc/elasticsearch/certs"
