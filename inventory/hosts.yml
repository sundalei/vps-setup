---
# Hosts are grouped by ROLE, not by machine. Playbooks target groups, so adding a
# service to a host is an inventory edit, never a change to a playbook.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:

    # Every machine we manage. The `common` role runs here
    vps:
      hosts:
        es1:
          ansible_host: 187.77.1.89
        es2:
          ansible_host: 31.97.136.158
        es3:
          ansible_host: 177.7.34.25

    # Nodes in the WireGuard mesh. wg0.conf peers with everyone else in here.
    wireguard_mesh:
      hosts:
        es1:
        es2:
        es3:

    # Elasticsearch cluster members. discovery.seed_hosts and the health gate's
    # expected node count are both derived from this group.
    es_cluster:
      hosts:
        es1:
        es2:
        es3:
