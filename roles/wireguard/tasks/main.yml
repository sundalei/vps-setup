---
# Idempotent WireGuard mesh between nodes over their public IPs.
# Keys are generated on each host once and public keys exchanged via hostvars.

- name: Install WireGuard
  ansible.builtin.package:
    name: "{{ 'wireguard-tools' if ansible_facts['os_family'] == 'RedHat' else 'wireguard' }}"
    state: present

- name: Generate private key (once)
  ansible.builtin.shell: "umask 077; wg genkey > /etc/wireguard/privatekey"
  args:
    # Turns private key creation idemponent
    creates: /etc/wireguard/privatekey

- name: Derive public key (once)
  ansible.builtin.shell: "wg pubkey < /etc/wireguard/privatekey > /etc/wireguard/publickey"
  args:
    # Turns public key derivation idemponent
    creates: /etc/wireguard/publickey

- name: Read this host's private key
  ansible.builtin.slurp:
    src: /etc/wireguard/privatekey
  register: wireguard_priv_slurp

- name: Read this host's public key
  ansible.builtin.slurp:
    src: /etc/wireguard/publickey
  register: wireguard_pub_slurp

# `slurp` returns file contents base64-encoded, so we decode. Setting these as
# facts makes them readable as hostvars[other_host].wireguard_public_key from other host
- name: Public keys as facts (public shared to peer; private stays local)
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ wireguard_priv_slurp.content | b64decode | trim }}"
    wireguard_public_key: "{{ wireguard_pub_slurp.content | b64decode | trim }}"
  no_log: true

- name: Open the WireGuard UDP port (firewalld / RedHat)
  ansible.posix.firewalld:
    port: "{{ wg_port }}/udp"
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts['os_family'] == 'RedHat'

- name: Open the WireGuard UDP port (ufw / Debian)
  community.general.ufw:
    rule: allow
    port: "{{ wg_port }}"
    proto: udp
  when: ansible_facts['os_family'] == 'Debian'

- name: Render wg0.conf
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard

- name: Enable and start the tunnel
  ansible.builtin.systemd:
    name: "wg-quick@{{ wg_interface }}"
    enabled: true
    state: started

# Handlers normally run at the END of the play. But the elasticsearch role (next)
# needs the tunnel already up, so we force pending handlers to run NOW with flush_handlers.
- name: Flush handlers so the tunnel is up before later roles use it
  ansible.builtin.meta: flush_handlers

- name: Verify mesh peers are reachable over the tunnel
  ansible.builtin.command: "ping -c2 -W2 {{ hostvars[item].wg_ip }}"
  loop: "{{ groups['wireguard_mesh'] | difference([inventory_hostname]) }}"
  changed_when: false
