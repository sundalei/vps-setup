---
# Cluster Node 2 & Public Web Tier (es2)
# ------------------------------------------------------------------------------
# 1. Elasticsearch Role:
#    - Master-eligible & data node in the 3-node HA quorum (2 of 3 votes).
# 2. Public Web / Reverse Proxy:
#    - Hosts edge services (kibana, web_proxy); public domains resolve to this host.
#
# Note: Which services run here is governed by group membership in
# `inventory/hosts.yml`, rather than variable toggles in this file.
wg_ip: "10.10.0.2"
wg_public_endpoint: "31.97.136.158" # this node's PUBLIC ip (peer dials this)

es_node_name: "es2"
es_cert_authority: false

# Public hostname for Kibana on this node (A record must point here)
kibana_domain: "kibana.sundalei.cloud"
es_domain: "es.sundalei.cloud"
