---
# Install Docker Engine on every host in the docker_hosts group.
#
# The steps run in this order:
#   1. repository -> add Docker's signing key and package repository for this OS.
#   2. config     -> write daemon.json BEFORE installing. apt starts Docker right
#                    after the install, and Docker should start with log limits.
#   3. install    -> install the engine, CLI, containerd and plugins.
#   4. service    -> start containerd and docker, and add docker_users to the docker group.
#   5. check      -> make sure the daemon answers, and that Docker joined firewalld.
#
# Warning: firewalld and ufw do NOT block ports published with -p,
# because Docker puts its own firewall rules before theirs.
# Publish ports on 127.0.0.1 (for example -p 127.0.0.1:8080:80) or on the WireGuard IP,
# and put Apache in front of anything that must be public.

- name: Stop if this OS family has no Docker repository set up
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "No Docker repository is set up for the {{ ansible_facts['os_family'] }} family."
    quiet: true

# repository
- name: Add the Docker repository (RedHat)
  ansible.builtin.import_tasks: repo-redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Add the Docker repository (Debian)
  ansible.builtin.import_tasks: repo-debian.yml
  when: ansible_facts['os_family'] == 'Debian'

# config
- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# notify only queues the restart. It runs later, at "Apply a changed daemon.json now"
# after Docker is installed and started.
# On a fresh server this means one extra restart right after the first start, which is harmless.
- name: Write daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Install
# Each package manager writes the version differently:
#   dnf: docker-ce=29.9.2                          (dnf lets us leave out the epoch)
#   apt: docker-ce=5:29.9.2-1~ubuntu.26.04~resolute  (epoch:version-revision)
# The apt version needs the "5:" epoch, or nothing matches.
# Its revision ends with the Ubuntu release (~noble, ~resolute), so we match it with a wildcard (*).
# To see the exact versions a server can install:
#   apt: sudo apt update && apt-cache madison docker-ce
#   dnf: dnf list --showduplicates docker-ce
# Only docker-ce and docker-ce-cli are pinned. The other packages get their newest version.
# If docker_version is empty, the newest version is installed.
- name: Install Docker Engine
  ansible.builtin.package:
    # \1 means the full matched package name (docker-ce or docker-ce-cli)
    # \2 just the optional -cli fragement
    name: "{{ docker_packages | map('regex_replace', '^(docker-ce(-cli)?)$', '\\1' ~ docker_version_suffix) | list }}"
    state: present
  vars:
    docker_version_suffix: >-
      {{ '' if not (docker_version | default('')) else
         ('-' ~ docker_version) if ansible_facts['os_family'] == 'RedHat' else
         ('=5:' ~ docker_version ~ '*') }}

# service
# Start containerd before docker, because docker needs it.
# "enabled: true" also makes both start again after a reboot.
- name: Start containerd and docker
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [containerd, docker]

# The new group only works after the user logs in again.
# Sessions that are already open don't get it.
- name: Let docker_users run docker without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

# If daemon.json changed, restart Docker now,
# so the checks below talk to Docker with the new settings.
- name: Apply a changed daemon.json now
  ansible.builtin.meta: flush_handlers
