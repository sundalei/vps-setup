---
# Kibana on es1. Connects to ES over loopback; Apache fronts it.
- name: Install kibana (RedHat, pinned to the stack version)
  ansible.builtin.dnf:
    name: "kibana-{{ elastic_stack_version }}"
    enablerepo: elasticsearch
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install kibana (Debian, pinned to the stack version)
  ansible.builtin.apt:
    name: "kibana={{ elastic_stack_version }}"
    state: present
  when: ansible_facts['os_family'] == 'Debian'

# Lock (hold) the version so `apt upgrade` or auto-updates won't accidentally
# upgrade Kibana and break the strict version match with Elasticsearch.
- name: Hold Kibana version (Debian)
  ansible.builtin.dpkg_selections:
    name: kibana
    selection: hold
  when: ansible_facts['os_family'] == 'Debian'

- name: Render kibana.yml
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: "0660"
  notify: Restart kibana

- name: Enable and start kibana
  ansible.builtin.systemd:
    name: kibana
    enabled: true
    state: started

- name: Apply pending restart if config changed
  ansible.builtin.meta: flush_handlers

# Poll the local API until Kibana is up. First boot is slow (~30-60s): Kibana
# initializes plugins, registers saved object migrations, and warms caches before
# serving. We hit loopback directly (not the public domain) to skip Apache/TLS
# and isolate failures to Kibana itself. 40 retries x 15s = 10 min ceiling.
- name: Wait for Kibana to answer locally (first boot is slow)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ kibana_port }}/api/status"
    method: GET
    status_code:
      - 200
      - 302
  register: kb_status # noqa: var-naming[no-role-prefix]
  until: kb_status.status in [200, 302]
  retries: 40
  delay: 15
