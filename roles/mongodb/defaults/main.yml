---
# MongoDB publishes one tarball per platform. There is no generic Linux build,
# so every OS gets the closest one. Fedora has no build at all, and Ubuntu 26.04
# does not have one yet, so they use the RHEL 10 and Ubuntu 24.04 builds.
# To support a new OS: add a line here and its checksum below.
mongodb_tarball_targets:
  Rocky-10: rhel10
  AlmaLinux-10: rhel10
  RedHat-10: rhel10
  CentOS-10: rhel10
  Rocky-9: rhel93
  Ubuntu-26: ubuntu2604
  Ubuntu-24: ubuntu2404
  Debian-12: debian12

# sha256 of each server tarball, from https://downloads.mongodb.org/current.json
mongodb_tarball_sha256:
  rhel10: 71948e4b405e129ffad7657e525b20d59b33b7a860e8eb851ac4916206f58f59
  ubuntu2604: b11e8183acad92f776b8bb5a22e1c6cb27b47246fce0f9e22342ed42bcdf2229

# mongosh has one build that runs on every Linux machine.
mongodb_mongosh_sha256: 8d24940ebe3675959b518fd41ea16b4e2182d6a75c09777db09cfa64e18834a1

# Which tarball this host needs. Empty means the OS is not in the list above.
mongodb_os_key: "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}"
mongodb_target: "{{ mongodb_tarball_targets[mongodb_os_key] | default('') }}"

# We install everything ourselves, so these paths are the same on every OS.
mongodb_user: mongod
mongodb_group: mongod
mongodb_data_dir: /var/lib/mongo
mongodb_log_dir: /var/log/mongodb
mongodb_log: /var/log/mongodb/mongod.log
mongodb_conf: /etc/mongod.conf
mongodb_keyfile: /var/lib/mongo/keyfile
mongodb_service: mongod

# /opt/mongodb and /opt/mongosh always point at the version we want.
mongodb_install_dir: "/opt/mongodb-linux-x86_64-{{ mongodb_target }}-{{ mongodb_version }}"
mongodb_link: /opt/mongodb
mongodb_mongosh_install_dir: "/opt/mongosh-{{ mongodb_mongosh_version }}-linux-x64"
mongodb_mongosh_link: /opt/mongosh

# MongoDB Database Tools (mongodump, mongorestore, ...). On by default.
mongodb_tools_install: true

# The tools have their own build names, and fewer of them than the server.
# The name is the "name" field in https://downloads.mongodb.org/tools/db/release.json
mongodb_tools_targets:
  rhel10: rhel10
  rhel93: rhel93
  ubuntu2404: ubuntu2404
  debian12: debian12
  ubuntu2604: ubuntu2604
mongodb_tools_target: "{{ mongodb_tools_targets[mongodb_target] | default('') }}"

# /opt/mongodb-tools always points at the version we want.
mongodb_tools_install_dir: "/opt/mongodb-database-tools-{{ mongodb_tools_target }}-x86_64-{{ mongodb_tools_version }}"
mongodb_tools_link: /opt/mongodb-tools

# Ansible runs "/bin/sh -c" and never reads /etc/profile.d, so it cannot find
# mongosh by name. It needs the full path.
mongodb_mongosh_bin: /opt/mongosh/bin/mongosh

# Ansible creates this database user on the first run.
mongodb_admin_user: "admin"

# The replica set is created once, from one member. Any member works, so we take
# the first host in the group.
mongodb_bootstrap_host: "{{ groups['mongo_cluster'] | first }}"

# Tunnel IPs that may reach MongoDB but are not cluster members (laptops, etc.)
mongodb_extra_client_ips: []
