---
# Java needs two things first:
#   bootstrap.yml  -> creates the dalei user (and zsh) that SDKMAN installs into
#   base.yml       -> base packages and the firewall
# No WireGuard: nothing here talks to the other servers.
# With these imports, this playbook is safe to run on a fresh server.
# site.yml runs them once itself and sets skip_prereqs so they are not repeated.
- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml
  when: not (skip_prereqs | default(false) | bool)

- name: Baseline
  ansible.builtin.import_playbook: base.yml
  when: not (skip_prereqs | default(false) | bool)

# Java dev environment for the admin user: SDKMAN, Java and Maven
- name: Java Dev environment
  hosts: vps
  become: true
  roles:
    - role: sdkman
      tags: [sdkman, java]
